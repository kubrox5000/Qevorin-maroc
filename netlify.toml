# Netlify Configuration for QEVORIN Moroccan E-Commerce Platform
# Framework: React 19 + TypeScript + Vite SPA + Express / Neon PostgreSQL

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--production=false"

# 1. Serverless API Proxy for Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 2. Single Page App (SPA) Client-Side Route Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 3. Security, HTTPS & Browser Protection Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
